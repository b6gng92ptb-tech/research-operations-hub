name: checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile for initial release if absent
        run: test -f package-lock.json || npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
      - run: npm run check:source
      - run: npm test
      - run: npm run build
